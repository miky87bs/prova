<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit Ruote Invernali 2026-27</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--ac:#1d4ed8;--acx:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#2a303b;--ac:#6ea0ff;--acx:#0f1218;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#2a303b;--ac:#6ea0ff;--acx:#0f1218;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}.kpi .card{padding:10px 12px}
.kpi b{display:block;font-size:22px}.kpi span,.mut{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.bar input[type=search]{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.tabs button{background:none;border:0;padding:8px 12px;font:inherit;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer}.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
button.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.s{padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kit{overflow:hidden;display:flex;flex-direction:column}.im{background:#fff;height:190px;display:flex;align-items:center;justify-content:center}.im img{max-width:100%;max-height:100%;object-fit:contain}.im span{color:#999;font-size:12px}
.kb{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}.kb b{font-size:15px}.pr{font-size:13px}.pr s{color:var(--mut)}.pr strong{font-size:16px}
.st{display:flex;gap:14px;border-top:1px solid var(--bd);margin-top:auto;padding-top:8px}.act{display:flex;gap:6px;margin-top:8px}
.bd{font-weight:700;border-radius:6px;padding:0 6px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.del td{text-decoration:line-through;opacity:.6}.del td:last-child{text-decoration:none;opacity:1}.del{background:rgba(220,38,38,.08)}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#e11d48;margin-left:7px;cursor:pointer;vertical-align:middle;box-shadow:0 0 0 3px rgba(225,29,72,.28)}.br{display:grid;grid-template-columns:100px 1fr 140px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bt{background:var(--bd);height:10px;border-radius:5px}.bt i{display:block;height:100%;background:var(--ac);border-radius:5px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-top:12px}.g2 .card{padding:12px}h3{font-size:14px;margin:0 0 8px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mut);text-transform:uppercase}.n{text-align:right}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(520px,94vw);padding:16px}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}.row{display:flex;gap:8px}.row>*{flex:1}.end{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hide{display:none}
</style></head><body><main>
<h1>❄️ Kit Ruote Invernali 2026-27</h1>
<div id="msg" class="card hide" style="padding:10px"></div>
<div class="kpi" id="kpi"></div>
<div class="tabs"><button data-t="cat" class="on">Catalogo e stock</button><button data-t="el">Elenco cerchi</button><button data-t="ven">Vendite</button><button data-t="dash">Dashboard</button></div>
<section id="cat"><div class="bar">
 <input type="search" id="q" placeholder="Cerca marca, modello, sigla, codice, colore, misura…"><select id="fm"></select>
 <label style="margin:0;display:flex;gap:4px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" id="fd" style="width:auto">Solo disponibili</label>
 <label style="margin:0;display:flex;gap:4px;align-items:center;color:var(--tx);font-size:14px">Sconto %<input type="number" id="sc" min="0" max="100" style="width:64px"></label>
 <button class="b" id="addKit">+ Kit</button><button class="b p" id="addSale">+ Vendita</button></div>
 <div class="grid" id="grid"></div></section>
<section id="ven" class="hide"><div class="bar"><input type="search" id="qs" placeholder="Cerca cliente, kit, auto…"><select id="fs2"></select><button class="b p" id="addSale2">+ Vendita</button></div>
 <div id="dalert" class="card bad hide" style="padding:10px;margin-bottom:10px;border-color:var(--bad);font-weight:600"></div><div class="card wrap"><table><thead><tr><th>Data</th><th>Sede</th><th>Kit</th><th>Cliente</th><th>Venditore</th><th>Auto / telaio</th><th>Consegna prevista</th><th class="n">Q.tà</th><th>Note</th><th></th></tr></thead><tbody id="sl"></tbody></table></div></section>

<section id="el" class="hide"><div class="bar"><input type="search" id="qe" placeholder="Cerca codice, marca, modello, cerchio…"><button class="b" id="csv">Scarica CSV (Excel)</button></div><div class="card wrap"><table style="min-width:900px"><thead><tr><th>Codice</th><th>Marca</th><th>Modello</th><th>Cerchio</th><th class="n">Stock MN</th><th class="n">Stock BS</th><th class="n">Stock tot.</th><th class="n">Vendite abbinate</th><th class="n">Disp. MN</th><th class="n">Disp. BS</th><th class="n">Disponibilità residua</th></tr></thead><tbody id="elt"></tbody></table></div></section>
<section id="dash" class="hide"></section>
<dialog id="dk"><form method="dialog" id="fk"><b id="dkt"></b><div id="kf"></div><div class="end"><button type="button" class="b" data-x="dk">Annulla</button><button class="b p">Salva</button></div></form></dialog>
<dialog id="dsv"><b id="dsvt"></b><div id="dsvb"></div><div class="end"><button type="button" class="b" data-x="dsv">Chiudi</button></div></dialog>
<dialog id="dmail"><b id="mtt">Vendita registrata ✓</b><p class="mut">Destinatari: <span id="mto"></span></p><pre id="mt" style="white-space:pre-wrap;font:13px/1.4 system-ui,sans-serif;background:var(--bg);padding:10px;border-radius:8px;max-height:240px;overflow:auto"></pre><div class="end"><button type="button" class="b" data-x="dmail">Chiudi</button><button type="button" class="b" id="mc">Copia testo</button><a id="ml" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;background:var(--ac);color:var(--acx);border-radius:8px;padding:8px 12px">Invia email</a></div></dialog>
<dialog id="dp"><form method="dialog" id="fp"><b>Modifica catalogo protetta</b><label>Password</label><input type="password" id="pw" autocomplete="off" required><div id="pe" class="bad" style="margin-top:6px"></div><div class="end"><button type="button" class="b" data-x="dp">Annulla</button><button class="b p">Sblocca</button></div></form></dialog>
<dialog id="ds"><form method="dialog" id="fs"><b>Registra vendita</b>
 <div class="row"><div><label>Sede</label><select name="sede" id="ssede"></select></div><div><label>Data vendita</label><input name="data" type="date" required></div></div>
 <div class="row"><div><label>Marca</label><select id="smar"></select></div><div><label>Modello</label><select id="smod"></select></div></div><label>Cerchio / kit</label><select name="kitId" id="sk" required></select><div id="sinfo" class="mut" style="margin-top:4px"></div><div id="simg" class="im" style="height:160px;margin-top:8px;border:1px solid var(--bd);border-radius:8px"></div>
 <div class="row"><div><label>Quantità</label><input name="qty" type="number" min="1" value="1" required></div><div><label>Cliente</label><input name="cliente" required></div></div><div class="row"><div><label>Venditore</label><select name="venditore" id="svend" required></select><input name="altro" id="saltro" class="hide" placeholder="Specifica il nome" style="margin-top:6px"><div id="svm" class="mut" style="margin-top:4px"></div></div><div><label>Consegna prevista</label><input name="consegna" type="date" required></div></div><datalist id="vl"></datalist>
 <label>Auto / telaio</label><input name="auto"><label>Note</label><input name="note">
 <div id="serr" class="bad" style="margin-top:8px"></div><div class="end"><button type="button" class="b" data-x="ds">Annulla</button><button class="b p">Registra</button></div></form></dialog>
</main>
